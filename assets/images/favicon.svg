<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022018" />
    </linearGradient>
  </defs>

  <!-- Premium Rounded Square Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Twin Peak Mountain 'M' -->
  <g transform="translate(10, 14)">
    <!-- Base horizon -->
    <line x1="2" y1="32" x2="42" y2="32" stroke="url(#favGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Peaks -->
    <path d="M 4 32 L 15 12 L 22 22 L 31 6 L 40 32" stroke="url(#favGold)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Snow peak caps (White) -->
    <path d="M 15 12 L 17.5 15.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 31 6 L 28 12.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
