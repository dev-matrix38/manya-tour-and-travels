<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" class="h-9 sm:h-10 w-auto">
  <defs>
    <linearGradient id="goldMtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- PahadYatra-style Twin Mountain 'M' Icon -->
  <g transform="translate(2, 6)">
    <!-- Base horizon -->
    <line x1="2" y1="32" x2="38" y2="32" stroke="url(#goldMtn)" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
    <!-- Mountain Peaks forming M -->
    <path d="M 3 32 L 14 11 L 21 21 L 29 5 L 37 32" stroke="url(#goldMtn)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Snow peak highlight strokes -->
    <path d="M 14 11 L 16.5 15" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 29 5 L 26 11.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography: Stacked Luxury Layout -->
  <g transform="translate(50, 0)">
    <!-- MANYA (Bold Crisp White) -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="0.5">
      MANYA
    </text>
    <!-- TOUR & TRAVELS (Amber-Gold Wide Tracking) -->
    <text x="0" y="39" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="url(#goldMtn)" letter-spacing="2.6">
      TOUR &amp; TRAVELS
    </text>
  </g>
</svg>
