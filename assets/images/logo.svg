<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none" class="h-10 sm:h-12 w-auto">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left side) -->
  <g transform="translate(10, 10)">
    <!-- Golden Sun behind peaks -->
    <circle cx="48" cy="24" r="14" fill="url(#sunGrad)" opacity="0.9" />
    <circle cx="48" cy="24" r="18" fill="#FDE68A" opacity="0.2" />

    <!-- Mountain Peaks -->
    <!-- Rear Peak -->
    <polygon points="48,8 68,48 28,48" fill="#047857" opacity="0.6" />
    <!-- Main Left Peak -->
    <polygon points="26,18 46,58 6,58" fill="#065F46" />
    <!-- Main Right Peak -->
    <polygon points="56,12 80,62 34,62" fill="#064E3B" />

    <!-- Snow caps -->
    <polygon points="26,18 32,30 20,30" fill="#FFFFFF" opacity="0.9" />
    <polygon points="56,12 64,26 48,26" fill="#FFFFFF" opacity="0.9" />
    <polygon points="48,8 54,20 42,20" fill="#FFFFFF" opacity="0.75" />

    <!-- Winding Mountain Road -->
    <path d="M 12 64 C 28 64, 24 50, 46 48 C 66 46, 58 36, 72 32" 
          stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 16 63 C 30 63, 26 51, 46 49 C 64 47, 58 37, 70 33" 
          stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.8" />

    <!-- Airplane Soaring -->
    <path d="M 68 14 L 76 10 L 73 17 L 78 19 L 71 20 L 70 23 L 68 21 L 67 22 L 67 18 Z" 
          fill="url(#goldGrad)" filter="url(#glow)" />
  </g>

  <!-- TEXT LOGO (Right side) -->
  <g transform="translate(105, 12)">
    <!-- "Manya" with serif flair and golden touch -->
    <text x="0" y="38" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="36" fill="url(#goldGrad)" letter-spacing="0.5">
      Manya
    </text>
    
    <!-- "Tour & Travels" in crisp bold sans -->
    <text x="135" y="36" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF" letter-spacing="1">
      Tour &amp; Travels
    </text>
    
    <!-- Tagline & Haldwani -->
    <g transform="translate(2, 54)">
      <!-- Location pill -->
      <rect x="0" y="-12" width="76" height="18" rx="9" fill="#065F46" />
      <circle cx="10" cy="-3" r="3" fill="#10B981" />
      <text x="18" y="1" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#E2E8F0" letter-spacing="0.8">
        HALDWANI
      </text>

      <!-- Slogan -->
      <text x="88" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#CBD5E1" letter-spacing="0.5">
        Travel • Explore • Create Memories
      </text>
    </g>
  </g>
</svg>